<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>

    <!-- CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        /* Header */
        header {
            background-color: #222;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Logo */
        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        /* Navigation */
        nav {
            display: flex;
            gap: 5px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 12px 15px;
            display: block;
        }

        /* Hover Effect */
        nav a:hover {
            background-color: #007bff;
        }

        /* Hamburger Button */
        .menu-btn {
            display: none;
            background: none;
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
        }

        /* Main Section */
        main {
            padding: 30px;
        }

        main h1 {
            margin-bottom: 15px;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {

            header {
                flex-wrap: wrap;
            }

            .menu-btn {
                display: block;
            }

            nav {
                display: none;
                flex-direction: column;
                width: 100%;
                margin-top: 15px;
            }

            nav.open {
                display: flex;
            }

            nav a {
                padding: 15px;
                border-top: 1px solid #444;
            }

            main {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- HTML -->
    <header>

        <div class="logo">MyShop</div>

        <button class="menu-btn" onclick="toggleMenu()">
            &#9776;
        </button>

        <nav id="menu">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <main>
        <h1>Welcome to MyShop</h1>

        <p>
            Resize the browser window to see the menu change.
        </p>
    </main>

    <!-- JavaScript -->
    <script>
        function toggleMenu() {

            let menu = document.getElementById("menu");

            menu.classList.toggle("open");

        }
    </script>

</body>
</html>
